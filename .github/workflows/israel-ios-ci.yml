name: Israel MOT Adapter CI & Build

on:
  push:
    branches:
      - main
      - feature/israel-mot-adapter
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - feature/israel-mot-adapter
      - 'feature/**'
      - 'fix/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test Israel MOT Adapter & Package IPA
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Cache Ruby Gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install Tools
        run: |
          brew install xcodegen
          bundle config path vendor/bundle
          bundle install --jobs 4

      - name: Generate Xcode Project
        run: |
          scripts/generate_project OneBusAway --no-watch

      - name: Pick the iOS Simulator
        run: |
          set -euo pipefail
          UDID=$(scripts/resolve_simulator_udid)
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Resolved simulator UDID: $UDID"

      - name: Run Israel MOT Unit Tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project OBAKit.xcodeproj \
            -scheme 'App' \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath DerivedData \
            -only-testing:OBAKitTests/MOTDTODecodingTests \
            -only-testing:OBAKitTests/MOTMapperTests \
            -only-testing:OBAKitTests/MOTHTTPClientTests \
            -only-testing:OBAKitTests/MOTCompatibilityDataLoaderTests \
            -only-testing:OBAKitTests/MOTTripPlanningTests \
            -only-testing:OBAKitTests/MOTGetRoutesEncodingTests \
            -only-testing:OBAKitTests/MOTFlexiblePolylineTests \
            -only-testing:OBAKitTests/MOTLocationWeatherTests \
            -only-testing:OBAKitTests/MOTRegionBootstrapTests \
            -only-testing:OBAKitTests/IsraelStopCatalogTests \
            -only-testing:OBAKitTests/TransitProviderRegistryTests

      - name: Build and Archive iOS App (Unsigned)
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project OBAKit.xcodeproj \
            -scheme 'App' \
            -destination 'generic/platform=iOS' \
            -archivePath build/OneBusAway.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Package Unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          APP_DIR=$(find build/OneBusAway.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "Error: No .app bundle found in archive!"
            exit 1
          fi
          echo "Found app bundle: $APP_DIR"
          cp -r "$APP_DIR" build/Payload/
          cd build
          zip -qry OneBusAway-Israel-unsigned.ipa Payload
          ls -lh OneBusAway-Israel-unsigned.ipa
          # Verify IPA contents
          unzip -l OneBusAway-Israel-unsigned.ipa | head -n 30

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneBusAway-Israel-unsigned-ipa
          path: build/OneBusAway-Israel-unsigned.ipa
          retention-days: 14

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: DerivedData/Logs/Test
          retention-days: 7
