targets:
  OBAWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: "."
      - path: ../IsraelMOT
        type: group
        excludes:
          - "Tests"
          - "Scripts"
          - "Docs"
          - "Resources"
          - "Map"
          - "Routes"
          - "OTPAdapter"
          - "UI"
          - "Weather"
          - "Search"
    dependencies:
      - target: OBAKitCore
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    entitlements:
      path: OBAWidget.entitlements
    info:
      path: Info.plist
      properties:
        # An extension's version must match its containing app's.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: true
